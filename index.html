<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johnny Castaway Reborn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #eef2f6;
    --ink-soft:   #a9b6c5;
    --paper:      #10151d;
    --paper-alt:  #182029;
    --line:       rgba(255,255,255,0.10);
    --card:       #1a222c;
    --sun:        #f0a202;
    --sun-deep:   #c97a12;
    --ocean:      #3fc1e0;
    --driftwood:  #cf9a5c;
    --night:      #080b10;
    --font-display: "Baloo 2", ui-rounded, "Segoe UI", sans-serif;
    --font-body:    "Karla", "Segoe UI", Arial, sans-serif;
    --font-mono:    "Space Mono", ui-monospace, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
  }

  body { overflow-x: hidden; }

  h1, h2, h3 {
    font-family: var(--font-display);
    text-wrap: balance;
    margin: 0 0 0.35em 0;
    color: var(--ink);
  }

  p { margin: 0 0 0.9em 0; max-width: 60ch; color: var(--ink-soft); }
  a { color: inherit; }

  code, .mono { font-family: var(--font-mono); font-size: 0.87em; }
  code { background: rgba(255,255,255,0.09); padding: 0.12em 0.4em; border-radius: 4px; color: var(--ink); }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ocean);
    display: block;
    margin-bottom: 0.6em;
  }

  .container { max-width: 980px; margin: 0 auto; padding: 0 24px; }
  section { padding: 52px 0; }
  section + section { border-top: 1px solid var(--line); }

  /* ============ LANGUAGE SWITCHER ============ */
  .langbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(16,21,29,0.86);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .langbar-inner {
    max-width: 820px;
    margin: 0 auto;
    padding: 10px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
  .langswitch { display: flex; gap: 4px; font-family: var(--font-mono); font-size: 0.78rem; }

  /* OTHER PROJECTS STRIP */
  .proj-strip-wrap { background: var(--paper); border-bottom: 1px solid var(--line); padding: 12px 0; }
  .proj-strip-row { display: flex; align-items: stretch; height: 104px; gap: 12px; max-width: 980px; margin: 0; padding: 0 24px; }
  @keyframes projLabelGlow {
    0%, 100% { color: var(--ink-soft); text-shadow: 0 0 4px var(--ocean); }
    50% { color: var(--ocean); text-shadow: 0 0 16px var(--ocean), 0 0 7px var(--ocean); }
  }
  .proj-strip-label {
    writing-mode: vertical-rl; text-orientation: upright; font-family: var(--font-mono); font-size: 0.5rem;
    letter-spacing: 0.04em; line-height: 1; text-transform: uppercase; color: var(--ink-soft); margin: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    animation: projLabelGlow 1.5s ease-in-out infinite;
  }
  .proj-strip-viewport { position: relative; flex: 1; min-width: 0; }
  .proj-strip { display: flex; height: 100%; gap: 9px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
  .proj-strip::-webkit-scrollbar { display: none; }
  .proj-card-sm {
    scroll-snap-align: start; flex: 0 0 auto; width: 142px; border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 10px; text-decoration: none; display: flex; flex-direction: column; gap: 2px;
    background-size: cover; background-position: center; position: relative; overflow: hidden;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .proj-card-sm:hover { transform: translateY(-2px); border-color: var(--ocean); }
  .proj-card-sm .proj-icon-sm { position: absolute; right: -6px; bottom: 4px; font-size: 3.8rem; margin: 0; opacity: 0.4; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); line-height: 1; }
  .proj-card-sm h4 { position: relative; z-index: 1; font-family: var(--font-display); font-size: 0.76rem; font-weight: 700; color: #fff; margin: 0; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
  .proj-card-sm span.desc { position: relative; z-index: 1; font-size: 0.62rem; line-height: 1.25; color: rgba(255,255,255,0.88); text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
  .proj-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.16); box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    color: #fff; cursor: pointer; font-size: 1.05rem; line-height: 1; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .proj-nav-prev { left: 4px; }
  .proj-nav-next { right: 4px; }
  .proj-nav:hover { background: var(--ocean); color: #08131c; border-color: var(--ocean); }
  .proj-nav[hidden] { display: none; }
  .proj-card-sm.grad-horas { background-image: linear-gradient(165deg, rgba(8,11,16,0.35), rgba(6,33,10,0.55) 55%, rgba(76,175,80,0.75) 100%), linear-gradient(160deg, #06210a, #1b5e20 55%, #4caf50); }
  .proj-card-sm.grad-3d { background-image: linear-gradient(165deg, rgba(8,11,16,0.35), rgba(22,52,48,0.55) 55%, rgba(201,106,46,0.75) 100%), linear-gradient(135deg, #163430, #2e8f87 60%, #c96a2e); }
  .proj-card-sm.grad-yb { background-image: linear-gradient(165deg, rgba(8,11,16,0.35), rgba(48,29,99,0.6) 55%, rgba(216,38,140,0.75) 100%), linear-gradient(135deg, #15102b, #4c1d95 55%, #d8268c); }
  .langswitch select {
    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 8px; font-family: var(--font-mono); font-size: 0.78rem; cursor: pointer;
  }
  .langswitch select:focus-visible { outline: 2px solid var(--ocean); outline-offset: 1px; }

  /* ============ HERO ============ */
  .hero { padding-top: 56px; }
  .hero-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; }
  .hero h1 { font-size: clamp(2.1rem, 4.6vw, 3rem); font-weight: 800; line-height: 1.05; }
  .hero .tagline { font-size: 1.08rem; }

  .cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
  .btn {
    font-family: var(--font-display); font-weight: 700; font-size: 0.98rem;
    padding: 12px 22px; border-radius: 10px; text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px; border: 2px solid transparent;
    transition: transform 0.12s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--ocean); outline-offset: 2px; }
  .btn-primary { background: var(--sun); color: var(--ink); box-shadow: 0 4px 0 var(--sun-deep); }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--sun-deep); }
  .btn-ghost { border-color: var(--ink); color: var(--ink); }
  .btn-sm { padding: 8px 14px; font-size: 0.85rem; border-radius: 8px; }

  /* ============ ILLUSTRATED SCREEN (original art, animated) ============ */
  .monitor {
    background: #dcd6c8; border-radius: 14px 14px 6px 6px; padding: 14px 14px 22px 14px;
    box-shadow: 0 16px 30px -14px rgba(0,0,0,0.55); position: relative; max-width: 340px; margin: 0 auto;
  }
  .monitor::after {
    content: ""; position: absolute; left: 50%; bottom: -11px; transform: translateX(-50%);
    width: 70px; height: 12px; background: #bdb49d; border-radius: 3px;
  }
  .screen {
    aspect-ratio: 4/3; border-radius: 5px; overflow: hidden; position: relative;
    background: linear-gradient(180deg, #79c7e8 0%, #bfe6d8 55%, #e8d9a8 100%);
    box-shadow: inset 0 0 0 5px #1a1a1a;
    transition: filter 0.35s ease;
  }
  .screen.f-green { filter: grayscale(1) sepia(1) hue-rotate(75deg) saturate(6) brightness(0.95); }
  .screen.f-amber { filter: grayscale(1) sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.05); }
  .screen.f-strong { filter: contrast(1.15) brightness(0.8) saturate(1.1); }
  .screen.f-sepia { filter: sepia(0.65) contrast(0.85) brightness(1.08); }

  .cloud { position: absolute; background: #fff; border-radius: 40px; opacity: 0.85; animation: drift 26s linear infinite; }
  .cloud::before, .cloud::after { content:""; position:absolute; background:inherit; border-radius:50%; }
  .c1 { width: 46px; height: 14px; top: 12%; left: -20%; }
  .c1::before { width: 22px; height: 22px; top: -10px; left: 6px; }
  .c1::after { width: 16px; height: 16px; top: -6px; left: 26px; }
  .c2 { width: 32px; height: 10px; top: 24%; left: -40%; animation-delay: -9s; animation-duration: 32s; }
  .c2::before { width: 16px; height: 16px; top: -7px; left: 5px; }

  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(480px); } }

  .sun-ill {
    position: absolute; top: 13%; right: 15%; width: 15%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe08a, var(--sun) 70%);
    animation: glint 3.4s ease-in-out infinite;
  }
  @keyframes glint { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }

  .sea { position: absolute; bottom: 0; left: 0; right: 0; height: 42%; background: linear-gradient(180deg, var(--ocean) 0%, #0a4a5c 100%); }
  .sea::before {
    content:""; position:absolute; top:-4px; left:0; right:0; height:8px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.55) 0 18px, transparent 18px 42px);
    animation: waves 2.6s linear infinite;
  }
  @keyframes waves { from { background-position-x: 0; } to { background-position-x: 60px; } }

  .island { position: absolute; bottom: 34%; left: 30%; width: 46%; height: 14%; background: #ead2a3; border-radius: 50% 50% 20% 20% / 90% 90% 20% 20%; }
  .trunk { position: absolute; bottom: 40%; left: 47%; width: 3%; height: 22%; background: var(--driftwood); border-radius: 2px; transform: rotate(-6deg); }
  .frond { position: absolute; bottom: 58%; left: 41%; width: 20%; height: 10%; background: #3f7d4a; border-radius: 100% 0 100% 0; }
  .frond.f2 { transform: scaleX(-1) rotate(8deg); left: auto; right: 32%; background: #366b40; }
  .frond.f3 { transform: rotate(20deg); background: #4a9256; bottom: 56%; }

  /* A small generic castaway silhouette (own design, not a copy of any
     copyrighted character) -- just his bearded, hatted head and shoulders
     above the waterline, like he's swimming/wading rather than standing,
     which is both simpler to read at this size and avoids the previous
     tall-narrow-plus-round-cap silhouette reading as something it very
     much shouldn't. */
  .castaway {
    position: absolute; bottom: 40%; left: 34%; width: 16px; height: 16px;
    transform-origin: bottom center;
    transform: scale(1.8);
    animation: swim 8s ease-in-out infinite;
  }
  .castaway .hat {
    width: 10px; height: 4px; margin: 0 auto;
    background: #f2ede1;
    border-radius: 50% 50% 15% 15%;
    position: relative;
  }
  .castaway .hat::before {
    content: ""; position: absolute; bottom: 0; left: 0;
    width: 10px; height: 1px; background: #2f2a24;
  }
  .castaway .hat::after {
    content: ""; position: absolute; bottom: -1.5px; left: -1.5px;
    width: 13px; height: 1.6px; background: #f2ede1; border: 1px solid #d8d0bd; border-radius: 2px;
  }
  .castaway .head {
    width: 9px; height: 7px; margin: 1px auto 0 auto;
    background: #e0b088;
    border-radius: 42% 42% 50% 50%;
    position: relative;
  }
  .castaway .head::before, .castaway .head::after {
    content: ""; position: absolute; top: 2.6px;
    width: 1.3px; height: 1.3px; border-radius: 50%; background: #3a2b1f;
  }
  .castaway .head::before { left: 1.8px; }
  .castaway .head::after  { left: 5.9px; }
  .castaway .beard {
    width: 6.5px; height: 2.5px; margin: -1px auto 0 auto;
    background: #1c1c1c;
    border-radius: 0 0 3px 3px;
    position: relative;
  }
  .castaway .beard::before {
    content: ""; position: absolute; top: -1.4px; left: 50%;
    transform: translateX(-50%);
    width: 7.5px; height: 1.4px;
    background: #1c1c1c;
    border-radius: 1px;
  }
  .castaway .shoulders {
    width: 13px; height: 3px; margin: -0.5px auto 0 auto;
    background: #cf9a6a;
    border-radius: 3px 3px 1px 1px;
  }
  @keyframes swim {
    0%   { left: 34%; bottom: 40%; transform: scale(1.8) scaleX(1); }
    23%  { bottom: 41%; }
    45%  { left: 54%; bottom: 40%; transform: scale(1.8) scaleX(1); }
    50%  { transform: scale(1.8) scaleX(-1); }
    73%  { bottom: 41%; }
    95%  { left: 34%; bottom: 40%; transform: scale(1.8) scaleX(-1); }
    100% { left: 34%; bottom: 40%; transform: scale(1.8) scaleX(1); }
  }

  .scanlines {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
    transition: opacity 0.3s ease;
  }
  .screen.f-crt .scanlines, .screen.f-strong .scanlines { opacity: 1; }

  .vignette {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
    transition: opacity 0.3s ease;
  }
  .screen.f-strong .vignette { opacity: 1; }

  .carousel-controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
  .carousel-controls button {
    background: var(--card); border: 1px solid var(--line); width: 34px; height: 34px; border-radius: 50%;
    font-size: 1rem; cursor: pointer; color: var(--ink);
  }
  .carousel-controls button:focus-visible { outline: 2px solid var(--ocean); }
  .filter-label { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-soft); min-width: 148px; text-align: center; }

  /* ============ SECTION HEAD ============ */
  .section-head { margin-bottom: 30px; }
  .section-head h2 { font-size: clamp(1.5rem, 3.4vw, 1.9rem); }

  /* ============ FEATURE LIST (no color swatches) ============ */
  .feat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 28px; }
  .feat { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .feat h3 { font-size: 1rem; margin-bottom: 0.2em; display: flex; align-items: center; gap: 8px; }
  .feat h3 svg { width: 18px; height: 18px; stroke: var(--ocean); flex-shrink: 0; }
  .feat p { font-size: 0.92rem; margin-bottom: 0; }

  /* ============ STEPS ============ */
  .steps { counter-reset: step; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
  .steps li::before {
    content: counter(step); font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
    width: 30px; height: 30px; border-radius: 8px; background: var(--paper-alt); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; color: var(--ink); flex-shrink: 0;
  }
  .steps li p { margin: 2px 0 0 0; font-size: 0.94rem; }
  .steps li strong { font-family: var(--font-display); font-size: 0.98rem; }

  /* ============ TABLES ============ */
  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; min-width: 480px; background: var(--card); font-size: 0.88rem; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; background: var(--paper-alt); }
  tr:last-child td { border-bottom: none; }

  details.legal { border: 1px solid var(--line); border-radius: 10px; padding: 4px 18px; background: var(--card); margin-bottom: 10px; }
  details.legal summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; padding: 12px 0; }
  details.legal p { font-size: 0.88rem; padding-bottom: 14px; max-width: none; }

  /* ============ PROJECT CARDS ============ */
  .proj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .proj-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .proj-icon { font-size: 1.7rem; }
  .proj-card h3 { font-size: 1.05rem; margin-bottom: 0; }
  .proj-card p { font-size: 0.9rem; margin-bottom: 4px; }
  .proj-card .btn { align-self: flex-start; }

  footer { background: var(--night); color: #dfe6f5; padding: 52px 0 34px 0; }
  footer .container { display: flex; flex-direction: column; gap: 28px; }
  footer h2 { color: #fff8ec; }
  footer .meta { font-family: var(--font-mono); font-size: 0.8rem; color: #9aa7c2; text-align: center; }
  footer a.gh { color: var(--sun); font-weight: 700; text-decoration: none; }

  [data-i18n], [data-lang-only] { }
  .hide { display: none !important; }

  @media (max-width: 720px) {
    .hero-grid { grid-template-columns: 1fr; }
    section { padding: 40px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .sun-ill, .sea::before, .castaway { animation: none !important; }
    .reveal { opacity: 1; transform: none; transition: none; }
  }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .reveal.in-view { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div class="proj-strip-wrap">
  <div class="proj-strip-row">
  <p class="proj-strip-label" data-i18n="strip.label"></p>
  <div class="proj-strip-viewport">
  <button type="button" class="proj-nav proj-nav-prev" onclick="scrollProjStrip(this,-1)" aria-label="Previous" hidden>&#8249;</button>
  <div class="proj-strip" onscroll="updateProjNav(this)">
    <a class="proj-card-sm grad-horas" href="https://yoluha.github.io/horas/">
      <span class="proj-icon-sm">⏱️</span>
      <h4>Horas</h4>
      <span class="desc" data-i18n="shortHoras"></span>
    </a>
    <a class="proj-card-sm grad-3d" href="https://yoluha.github.io/3d-manager/">
      <span class="proj-icon-sm">📐</span>
      <h4>3D Manager</h4>
      <span class="desc" data-i18n="short3dmanager"></span>
    </a>
    <a class="proj-card-sm grad-yb" href="https://www.youtube.com/channel/UClEkyF0yv7Vyh2nRhKlvFlQ">
      <span class="proj-icon-sm">🎧</span>
      <h4>Yoshiki Beats</h4>
      <span class="desc" data-i18n="shortYoshiki"></span>
    </a>
  </div>
  <button type="button" class="proj-nav proj-nav-next" onclick="scrollProjStrip(this,1)" aria-label="Next" hidden>&#8250;</button>
  </div>
  </div>
</div>

<div class="langbar">
  <div class="langbar-inner">
    <span class="brand">🏝️ Johnny Castaway Reborn</span>
    <div class="langswitch">
      <select id="langSelect" onchange="setLanguage(this.value)"></select>
    </div>
  </div>
</div>

<!-- ================= HERO ================= -->
<section class="hero">
  <div class="container hero-grid">
    <div>
      <span class="eyebrow" data-i18n="hero.eyebrow"></span>
      <h1 data-i18n="hero.title"></h1>
      <p class="tagline" data-i18n="hero.tagline"></p>
      <div class="cta-row">
        <a class="btn btn-primary" href="https://github.com/yoluha/johnny-castaway-reborn/releases/latest" data-i18n="hero.download"></a>
        <a class="btn btn-ghost" href="#install" data-i18n="hero.howto"></a>
      </div>
    </div>
    <div>
      <div class="monitor">
        <div class="screen" id="demoScreen">
          <div class="cloud c1"></div>
          <div class="cloud c2"></div>
          <div class="sun-ill"></div>
          <div class="frond f3"></div>
          <div class="frond"></div>
          <div class="frond f2"></div>
          <div class="trunk"></div>
          <div class="island"></div>
          <div class="sea"></div>
          <div class="castaway"><div class="hat"></div><div class="head"></div><div class="beard"></div><div class="shoulders"></div></div>
          <div class="scanlines"></div>
          <div class="vignette"></div>
        </div>
      </div>
      <div class="carousel-controls">
        <button id="filterPrev" aria-label="Previous filter">‹</button>
        <span class="filter-label" id="filterLabel"></span>
        <button id="filterNext" aria-label="Next filter">›</button>

    var h = TABLE_HEADS[lang] || TABLE_HEADS.en;
    var head = id === "cliTable" ? [h.option, h.what] : [h.field, h.what];
    var html = "<tr><th>" + head[0] + "</th><th>" + head[1] + "</th></tr>";
    rows.forEach(function (r) { html += "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>"; });
    el.innerHTML = html;
  }

  var LANG_ORDER = ["en","pt","es","fr","de","it","pl","ja","nl","cs","zh","ru","ko","ne"];
  var LANG_NAMES = { en:"English", pt:"Português", es:"Español", fr:"Français", de:"Deutsch", it:"Italiano", pl:"Polski", ja:"日本語", nl:"Nederlands", cs:"Čeština", zh:"中文", ru:"Русский", ko:"한국어", ne:"नेपाली" };

  function setLanguage(lang) {
    if (!T[lang]) lang = "en";
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (T[lang][key] !== undefined) el.innerHTML = T[lang][key];
    });
    renderList("installSteps", "install.steps", lang);
    renderList("wpSteps", "wp.steps", lang);
    renderTable("settingsTable", "settings.rows", lang);
    renderTable("cliTable", "cli.rows", lang);
    var sel = document.getElementById("langSelect");
    if (sel && sel.value !== lang) sel.value = lang;
    document.documentElement.setAttribute("lang", lang);
    try { localStorage.setItem("jcr-lang", lang); } catch (e) {}
    fitProjLabel();
  }

  function fitProjLabel() {
    var el = document.querySelector(".proj-strip-label");
    if (!el) return;
    el.style.fontSize = "";
    var range = document.createRange();
    range.selectNodeContents(el);
    var natural = range.getBoundingClientRect().height;
    if (!natural) return;
    var scale = 90 / natural;
    scale = Math.max(0.7, Math.min(scale, 2.2));
    var rem = 0.5 * scale;
    rem = Math.max(0.38, Math.min(rem, 0.95));
    el.style.fontSize = rem.toFixed(3) + "rem";
  }

  (function () {
    var sel = document.getElementById("langSelect");
    sel.innerHTML = LANG_ORDER.map(function (code) {
      return '<option value="' + code + '">' + LANG_NAMES[code] + "</option>";
    }).join("");
  })();

  var initial = "en";
  try {
    var saved = localStorage.getItem("jcr-lang");
    if (saved && T[saved]) {
      initial = saved;
    } else {
      var nav = (navigator.language || "en").toLowerCase().slice(0, 2);
      if (LANG_ORDER.indexOf(nav) !== -1) initial = nav;
    }
  } catch (e) {}
  setLanguage(initial);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitProjLabel);
  }

  // ---- filter carousel ----
  var filters = [
    ["none", "Original"],
    ["crt", "CRT scanlines"],
    ["green", "Green monochrome"],
    ["amber", "Amber monochrome"],
    ["strong", "Strong CRT"],
    ["sepia", "Faded / sepia"]
  ];
  var fi = 0;
  var screenEl = document.getElementById("demoScreen");
  var labelEl = document.getElementById("filterLabel");
  function applyFilter() {
    screenEl.className = "screen" + (filters[fi][0] === "none" ? "" : " f-" + filters[fi][0]);
    labelEl.textContent = filters[fi][1];
  }
  document.getElementById("filterPrev").addEventListener("click", function () {
    fi = (fi - 1 + filters.length) % filters.length; applyFilter();
  });
  document.getElementById("filterNext").addEventListener("click", function () {
    fi = (fi + 1) % filters.length; applyFilter();
  });
  applyFilter();
})();

function scrollProjStrip(btn, dir) {
  const strip = btn.parentElement.querySelector('.proj-strip');
  const card = strip.querySelector('.proj-card-sm');
  const step = card ? card.offsetWidth + 9 : 150;
  strip.scrollBy({ left: dir * step * 2, behavior: 'smooth' });
}
function updateProjNav(strip) {
  const viewport = strip.parentElement;
  const prev = viewport.querySelector('.proj-nav-prev');
  const next = viewport.querySelector('.proj-nav-next');
  if (!prev || !next) return;
  const max = strip.scrollWidth - strip.clientWidth;
  const scrollable = max > 2;
  prev.hidden = !scrollable || strip.scrollLeft <= 2;
  next.hidden = !scrollable || strip.scrollLeft >= max - 2;
}
document.querySelectorAll('.proj-strip').forEach(updateProjNav);
window.addEventListener('resize', () => document.querySelectorAll('.proj-strip').forEach(updateProjNav));

(function initScrollReveal() {
  const targets = document.querySelectorAll('.reveal');
  if (!targets.length || typeof IntersectionObserver === 'undefined') {
    targets.forEach(el => el.classList.add('in-view'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  targets.forEach(el => observer.observe(el));
})();
</script>
